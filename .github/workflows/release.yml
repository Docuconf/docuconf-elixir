name: Release

# Push a tag such as v0.1.0 (matching @version in mix.exs) to publish to Hex.
# Hex has no OIDC trusted publishing, so this uses an API key stored as the
# HEX_API_KEY secret of the "hex" environment (see RELEASING.md).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: hex
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - name: Pick the docuconf-go ref
        id: dcref
        run: echo "ref=$(tr -d '[:space:]' < .github/docuconf-go.ref)" >> "$GITHUB_OUTPUT"
      - name: Check out docuconf-go
        uses: actions/checkout@v4
        with:
          repository: docuconf/docuconf-go
          ref: ${{ steps.dcref.outputs.ref }}
          path: docuconf-go
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: go install cuelang.org/go/cmd/cue@v0.17.1
      # The docuconf CLI compares the shared export fixture with its golden
      # contract (test/conformance_export_test.exs).
      - name: Build the docuconf CLI
        run: cd docuconf-go/cmd/docuconf && go build -o "$RUNNER_TEMP/docuconf" .

      - name: Check the tag matches mix.exs
        run: |
          version=$(grep -Eo '@version "[^"]+"' mix.exs | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match mix.exs version $version" >&2
            exit 1
          fi

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test
        env:
          DOCUCONF_SPEC_CUE: ${{ github.workspace }}/docuconf-go/spec/cue
          DOCUCONF_REQUIRE_VET: "1"
          # The shared conformance suite (SPEC §12), from the same checkout.
          DOCUCONF_CONFORMANCE: ${{ github.workspace }}/docuconf-go/conformance/cases.json
          DOCUCONF_REQUIRE_CONFORMANCE: "1"
          DOCUCONF_CLI: ${{ runner.temp }}/docuconf

      - name: Publish to Hex
        env:
          MIX_ENV: dev
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          mix deps.get
          mix hex.publish --yes

  # Attaches the Hex package tarball (mix hex.build) to the GitHub Release for
  # the tag. GitHub Packages has no Hex registry, so the Release is the GitHub
  # copy. It runs the same checks as `publish` but does not depend on it, so
  # it works with only the workflow's GITHUB_TOKEN. See RELEASING.md.
  github:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub Release and upload its assets
      packages: write
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - name: Pick the docuconf-go ref
        id: dcref
        run: echo "ref=$(tr -d '[:space:]' < .github/docuconf-go.ref)" >> "$GITHUB_OUTPUT"
      - name: Check out docuconf-go
        uses: actions/checkout@v4
        with:
          repository: docuconf/docuconf-go
          ref: ${{ steps.dcref.outputs.ref }}
          path: docuconf-go
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: go install cuelang.org/go/cmd/cue@v0.17.1
      # The docuconf CLI compares the shared export fixture with its golden
      # contract (test/conformance_export_test.exs).
      - name: Build the docuconf CLI
        run: cd docuconf-go/cmd/docuconf && go build -o "$RUNNER_TEMP/docuconf" .

      - name: Check the tag matches mix.exs
        run: |
          version=$(grep -Eo '@version "[^"]+"' mix.exs | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match mix.exs version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test
        env:
          DOCUCONF_SPEC_CUE: ${{ github.workspace }}/docuconf-go/spec/cue
          DOCUCONF_REQUIRE_VET: "1"
          DOCUCONF_CONFORMANCE: ${{ github.workspace }}/docuconf-go/conformance/cases.json
          DOCUCONF_REQUIRE_CONFORMANCE: "1"
          DOCUCONF_CLI: ${{ runner.temp }}/docuconf

      - name: Build the Hex package
        env:
          MIX_ENV: dev
        run: |
          mix deps.get
          mix hex.build --output "docuconf-$VERSION.tar"

      - name: Attach the package to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            flags=()
            case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "docuconf $VERSION" "${flags[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" "docuconf-$VERSION.tar" --clobber
