name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly against docuconf-go main; push and pull_request use .github/docuconf-go.ref.
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      docuconf_go_ref:
        description: docuconf-go ref to test against (empty means .github/docuconf-go.ref)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - otp: "25"
            elixir: "1.18"
          - otp: "27"
            elixir: "1.18"
          - otp: "28"
            elixir: "1.19"
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - name: Pick the docuconf-go ref
        id: dcref
        env:
          EVENT: ${{ github.event_name }}
          OVERRIDE: ${{ inputs.docuconf_go_ref }}
        run: |
          if [ "$EVENT" = schedule ]; then echo "ref=main" >> "$GITHUB_OUTPUT"
          elif [ -n "$OVERRIDE" ]; then echo "ref=$OVERRIDE" >> "$GITHUB_OUTPUT"
          else echo "ref=$(tr -d '[:space:]' < .github/docuconf-go.ref)" >> "$GITHUB_OUTPUT"; fi

      # The contract meta-schema (spec/cue) and the conformance suite
      # (conformance/cases.json) live in docuconf-go; the tests use both.
      - name: Check out docuconf-go
        uses: actions/checkout@v4
        with:
          repository: docuconf/docuconf-go
          ref: ${{ steps.dcref.outputs.ref }}
          path: docuconf-go

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install cue
        run: go install cuelang.org/go/cmd/cue@v0.17.1

      # The docuconf CLI, from the same checkout, compares the shared export
      # fixture with conformance/export/golden.cue.
      - name: Build the docuconf CLI
        run: cd docuconf-go/cmd/docuconf && go build -o "$RUNNER_TEMP/docuconf" .

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test
        env:
          DOCUCONF_SPEC_CUE: ${{ github.workspace }}/docuconf-go/spec/cue
          DOCUCONF_REQUIRE_VET: "1"
          # The shared conformance suite (SPEC §12), from the same checkout.
          DOCUCONF_CONFORMANCE: ${{ github.workspace }}/docuconf-go/conformance/cases.json
          DOCUCONF_REQUIRE_CONFORMANCE: "1"
          # The shared export check (SPEC §11.2 item 3).
          DOCUCONF_CLI: ${{ runner.temp }}/docuconf

      # Every case runs: the suite fails if any is skipped (the "skips
      # nothing" test), and so does this script.
      - name: Run scripts/conformance.sh
        run: DOCUCONF_GO_DIR="$GITHUB_WORKSPACE/docuconf-go" DOCUCONF_CLI="$RUNNER_TEMP/docuconf" scripts/conformance.sh

  example:
    name: examples/orders
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Pick the docuconf-go ref
        id: dcref
        env:
          EVENT: ${{ github.event_name }}
          OVERRIDE: ${{ inputs.docuconf_go_ref }}
        run: |
          if [ "$EVENT" = schedule ]; then echo "ref=main" >> "$GITHUB_OUTPUT"
          elif [ -n "$OVERRIDE" ]; then echo "ref=$OVERRIDE" >> "$GITHUB_OUTPUT"
          else echo "ref=$(tr -d '[:space:]' < .github/docuconf-go.ref)" >> "$GITHUB_OUTPUT"; fi

      # The contract meta-schema (spec/cue) lives in docuconf-go.
      - name: Check out docuconf-go
        uses: actions/checkout@v4
        with:
          repository: docuconf/docuconf-go
          ref: ${{ steps.dcref.outputs.ref }}
          path: docuconf-go

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install cue
        run: go install cuelang.org/go/cmd/cue@v0.17.1

      - name: Build
        working-directory: examples/orders
        run: |
          mix format --check-formatted
          mix compile --warnings-as-errors

      # The webhook key set: a rotation, and the key sets that fail at boot.
      - name: Test
        working-directory: examples/orders
        run: mix test

      # Ignores metadata.generator.version, which release PRs bump.
      - name: Contract is up to date
        working-directory: examples/orders
        run: |
          mix docuconf.export --output "$RUNNER_TEMP/contract.cue"
          ../../scripts/check-generated.sh --files contract.cue "$RUNNER_TEMP/contract.cue"

      - name: Contract passes the meta-schema
        run: |
          dir="$(mktemp -d)"
          cp -r docuconf-go/spec/cue/cue.mod docuconf-go/spec/cue/contract "$dir/"
          mkdir "$dir/orders"
          cp examples/orders/contract.cue "$dir/orders/"
          cd "$dir" && cue vet -c ./orders

      # CONFIG.md, CONFIG.agents.md and docs.json are generated from the
      # committed contract.cue (the export above writes to a temp file, so a
      # release's generator.version bump stays as committed) by docuconf
      # docs, built from the docuconf-go checkout. These are the README's
      # commands.
      - name: Generated docs are up to date
        run: |
          (cd docuconf-go/cmd/docuconf && go build -o "$RUNNER_TEMP/docuconf" .)
          cd examples/orders
          "$RUNNER_TEMP/docuconf" docs contract.cue --check CONFIG.md
          "$RUNNER_TEMP/docuconf" docs contract.cue --format agents --check CONFIG.agents.md
          "$RUNNER_TEMP/docuconf" docs contract.cue --format model --check docs.json

      - name: Smoke test
        run: examples/orders/smoke.sh
